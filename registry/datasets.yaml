# DAWcoder 数据集注册表（唯一事实源）
# 字段说明见 schemas/dataset.schema.json；许可档位见 registry/licenses.yaml
version: 1
datasets:
  - id: slakh2100
    name: Slakh2100
    task: [mix, texture]
    subtasks: [stem_balance, bus_processing, midi_texture]
    source_type: public_multitrack
    modality: [audio, midi]
    license:
      spdx: CC-BY-4.0
      evidence: {url: "https://zenodo.org/records/4599666", captured_at: "2026-11-07", reviewer: "shokoup"}
    citation: "Manilow et al., Cutting Music Source Separation Some Slakh, WASPAA 2019"
    fetch: {method: zenodo, url: "https://zenodo.org/records/4599666/files/slakh2100_flac_redux.tar.gz", sha256: "", size_bytes: 112000000000}
    splits: {policy: song_level, group_key: lakh_md5}
    notes: "由 Lakh MIDI 合成；与 Lakh/MidiCaps 共享 song-level split；勿用 omitted/ 目录"

  - id: babyslakh
    name: BabySlakh
    task: [mix]
    subtasks: [smoke_test]
    source_type: public_multitrack
    modality: [audio, midi]
    license:
      spdx: CC-BY-4.0
      evidence: {url: "https://zenodo.org/records/4603870", captured_at: "2026-11-07", reviewer: "shokoup"}
    citation: "Manilow et al., 2019 (Slakh)"
    fetch: {method: zenodo, url: "https://zenodo.org/records/4603870/files/babyslakh_16k.tar.gz", sha256: "", size_bytes: 925700000}
    splits: {policy: song_level, group_key: lakh_md5}
    notes: "20 首 16kHz，用于 CI 冒烟与快速原型"

  - id: lakh-midi
    name: Lakh MIDI Dataset v0.1
    task: [texture, mix]
    subtasks: [midi_texture, param_prior]
    source_type: public_midi
    modality: [midi]
    license:
      spdx: CC-BY-4.0
      evidence: {url: "https://colinraffel.com/projects/lmd/", captured_at: "2026-11-07", reviewer: "shokoup"}
    citation: "Colin Raffel, Learning-Based Methods for Comparing Sequences, PhD Thesis 2016"
    fetch: {method: url, url: "http://hog.ee.columbia.edu/craffel/lmd/lmd_full.tar.gz", sha256: "", size_bytes: 1600000000}
    splits: {policy: song_level, group_key: md5}
    notes: "上游为受版权歌曲转录；商用训练保留，但生成侧需 MIDI 指纹过滤"

  - id: pdmx
    name: PDMX (public domain MusicXML)
    task: [texture, form]
    subtasks: [voicing, arrangement_skeleton]
    source_type: public_musicxml
    modality: [musicxml, midi]
    license:
      spdx: Public-Domain
      evidence: {url: "https://zenodo.org/records/15571083", captured_at: "2026-11-07", reviewer: "shokoup"}
    citation: "Long et al., PDMX, ICASSP 2025"
    fetch: {method: zenodo, url: "https://zenodo.org/records/15571083", sha256: "", size_bytes: 15000000000}
    splits: {policy: song_level, group_key: pdmx_path}
    notes: "只用 no_license_conflict 子集（222,856 首）；采集自 MuseScore 公有领域条目"

  - id: salami-annotations
    name: SALAMI structural annotations
    task: [form]
    subtasks: [section_boundaries, section_labels]
    source_type: public_annotation
    modality: [annotation]
    license:
      spdx: CC0-1.0
      evidence: {url: "https://ddmal.ca/research/salami/annotation/", captured_at: "2026-11-07", reviewer: "shokoup"}
    citation: "Smith et al., SALAMI, ISMIR 2011"
    fetch: {method: git, url: "https://github.com/DDMAL/salami-data-public", sha256: "", size_bytes: 50000000}
    splits: {policy: song_level, group_key: salami_track_id}
    notes: "只含标注；对应音频需自行从 Internet Archive 获取并核对权利"

